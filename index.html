<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Tesouro de Erebor - Widget Saldos</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Firebase Compat Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=MedievalSharp&display=swap" rel="stylesheet">

  <style>
    body { background-color: #0f0d0a; color: #e2d2b4; font-family: 'MedievalSharp', cursive, serif; }
    .font-title { font-family: 'Cinzel Decorative', serif; }
    .gold-border { border: 1px solid #b8860b; box-shadow: 0 0 10px rgba(184, 134, 11, 0.15); }
    .elvish-glow:focus-within, .elvish-glow:hover { box-shadow: 0 0 12px rgba(212, 175, 55, 0.35); border-color: #d4af37; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f0d0a; }
    ::-webkit-scrollbar-thumb { background: #3a2e1e; border-radius: 3px; }
  </style>
</head>
<body class="p-3 md:p-5 min-h-screen flex flex-col justify-between" x-data="saldosApp()">

  <div class="max-w-4xl mx-auto w-full space-y-5">
    
    <!-- HEADER ÉPICO -->
    <header class="flex justify-between items-center border-b border-[#3a2e1e] pb-3">
      <div>
        <h1 class="font-title text-xl md:text-2xl text-[#d4af37] tracking-wider drop-shadow-md">
          💰 O Tesouro de Erebor
        </h1>
        <p class="text-[11px] md:text-xs text-[#a39274]">
          Gestão de Saldos & Disponibilidade Financeira dos Cofres
        </p>
      </div>

      <button @click="carregarDados()" 
        class="bg-[#1c1712] hover:bg-[#2e2316] text-[#d4af37] text-xs font-semibold py-1.5 px-3 rounded border border-[#b8860b]/40 flex items-center gap-1.5 transition cursor-pointer active:scale-95">
        <span :class="carregando ? 'animate-spin' : ''">⚡</span>
        <span x-text="carregando ? 'Sincronizando...' : 'Sincronizar'"></span>
      </button>
    </header>

    <!-- CARD TOTALIZADOR CENTRAL -->
    <section class="bg-[#181410] p-4 rounded-lg gold-border flex justify-between items-center">
      <div>
        <span class="text-xs text-[#a39274]">💎 Total Disponível em Cofres</span>
        <div class="text-2xl font-bold text-[#d4af37] mt-1" x-text="formatarMoeda(calcularTotal())"></div>
      </div>
      <div class="text-right">
        <span class="text-[10px] bg-[#2e2316] text-[#a39274] px-2.5 py-1 rounded-full border border-[#b8860b]/30">
          <span x-text="saldos.length"></span> Cofres Registrados
        </span>
      </div>
    </section>

    <!-- FORMULÁRIO DE REGISTRO / EDIÇÃO DE SALDO -->
    <section class="bg-[#181410] p-4 rounded-lg gold-border space-y-3">
      <h2 class="text-sm text-[#d4af37] font-semibold flex items-center justify-between">
        <span class="flex items-center gap-2">
          <span>✍️</span> 
          <span x-text="editandoId ? 'Atualizar Saldo do Cofre' : 'Registrar Saldo em Cofre'"></span>
        </span>
        <button x-show="editandoId" @click="cancelarEdicao()" class="text-xs text-[#8b0000] hover:underline">Cancelar Edição</button>
      </h2>

      <form @submit.prevent="salvarSaldo()" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <!-- Seleção do Banco / Conta (Carregado do Módulo 01) -->
        <div>
          <label class="block text-[11px] text-[#a39274] mb-1">Conta / Banco (Módulo 01)</label>
          <select x-model="contaSelecionada" required
            class="w-full bg-[#0f0d0a] border border-[#3a2e1e] text-[#e2d2b4] text-xs rounded p-2.5 outline-none elvish-glow transition">
            <option value="">Selecione a conta...</option>
            <template x-for="c in contasCadastradas" :key="c.id">
              <option :value="c.nome" x-text="c.nome"></option>
            </template>
          </select>
        </div>

        <!-- Valor do Saldo -->
        <div>
          <label class="block text-[11px] text-[#a39274] mb-1">Valor Atual (R$)</label>
          <input type="number" step="0.01" x-model="valorInput" placeholder="Ex: 1500.00" required
            class="w-full bg-[#0f0d0a] border border-[#3a2e1e] text-[#e2d2b4] text-xs rounded p-2.5 outline-none elvish-glow transition">
        </div>

        <!-- Botão Ação -->
        <div class="flex items-end">
          <button type="submit" 
            class="w-full bg-[#b8860b] hover:bg-[#d4af37] text-[#0f0d0a] font-bold py-2.5 px-4 text-xs rounded transition duration-200 cursor-pointer active:scale-95">
            <span x-text="editandoId ? 'Atualizar Saldo' : '⚔️ Guardar no Cofre'"></span>
          </button>
        </div>
      </form>

      <!-- Alerta se não houver contas no Módulo 01 -->
      <template x-if="contasCadastradas.length === 0">
        <p class="text-[11px] text-[#e5a93c] italic pt-1">
          💡 Dica: Cadastre suas contas na <strong>Central de Cadastros Base (Módulo 01)</strong> para elas aparecerem na lista acima.
        </p>
      </template>
    </section>

    <!-- LISTA DE COFRES & SALDOS -->
    <section class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
      <template x-for="s in saldos" :key="s.id">
        <div class="bg-[#14100c] p-3.5 rounded-lg border border-[#2e2316] flex flex-col justify-between space-y-2">
          <div class="flex justify-between items-start">
            <div class="flex items-center gap-1.5">
              <span class="text-base">🏦</span>
              <span class="font-bold text-sm text-[#e2d2b4]" x-text="s.conta"></span>
            </div>
            
            <div class="flex items-center gap-2">
              <button @click="prepararEdicao(s)" title="Editar Saldo" class="text-[#d4af37] hover:text-[#fff] text-xs font-bold">✎</button>
              <button @click="excluirSaldo(s.id)" title="Excluir" class="text-[#8b0000] hover:text-[#ff4500] text-xs font-bold">✕</button>
            </div>
          </div>

          <div class="border-t border-[#2e2316] pt-2 flex justify-between items-end">
            <span class="text-[10px] text-[#6e5d4f]">Saldo Disponível</span>
            <span class="text-base font-bold text-[#d4af37]" x-text="formatarMoeda(s.valor)"></span>
          </div>
        </div>
      </template>
    </section>

    <template x-if="saldos.length === 0">
      <div class="bg-[#14100c] p-6 rounded-lg border border-[#2e2316] text-center text-xs text-[#6e5d4f] italic">
        Nenhum cofre com saldo cadastrado. Adicione um saldo acima para começar.
      </div>
    </template>

  </div>

  <!-- FOOTER STATUS -->
  <footer class="mt-6 text-center text-[9px] text-[#6e5d4f] border-t border-[#2e2316] pt-2">
    <span>O Tesouro de Erebor • Sincronizado com Projeto Erebor OS</span>
  </footer>

  <!-- SCRIPT FIREBASE COMPAT + ALPINE LOGIC -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDU3mYKoWh8qE3wj6R5OKqhWwXMeefEl2g",
      authDomain: "erebor-os.firebaseapp.com",
      projectId: "erebor-os",
      storageBucket: "erebor-os.firebasestorage.app",
      messagingSenderId: "733641275906",
      appId: "1:733641275906:web:d83dedfee8bc056a7e851b"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.addEventListener('alpine:init', () => {
      Alpine.data('saldosApp', () => ({
        saldos: [],
        contasCadastradas: [],
        contaSelecionada: '',
        valorInput: '',
        editandoId: null,
        carregando: false,

        init() {
          this.escutarContasDoModulo01();
          this.escutarSaldos();
        },

        // Busca as contas cadastradas no Módulo 01 (coleção "entidades")
        escutarContasDoModulo01() {
          db.collection("entidades").where("categoria", "==", "Conta").onSnapshot((snapshot) => {
            const list = [];
            snapshot.forEach((doc) => {
              list.push({ id: doc.id, ...doc.data() });
            });
            this.contasCadastradas = list;
          });
        },

        // Escuta os saldos cadastrados na coleção "saldos"
        escutarSaldos() {
          db.collection("saldos").onSnapshot((snapshot) => {
            const list = [];
            snapshot.forEach((doc) => {
              list.push({ id: doc.id, ...doc.data() });
            });
            this.saldos = list;
            this.atualizarDashboardCentral();
          });
        },

        async salvarSaldo() {
          if (!this.contaSelecionada || this.valorInput === '') return;

          const dados = {
            conta: this.contaSelecionada,
            valor: parseFloat(this.valorInput) || 0,
            atualizadoEm: new Date().toISOString()
          };

          try {
            if (this.editandoId) {
              await db.collection("saldos").doc(this.editandoId).update(dados);
              this.cancelarEdicao();
            } else {
              await db.collection("saldos").add(dados);
              this.contaSelecionada = '';
              this.valorInput = '';
            }
          } catch(e) {
            console.error("Erro ao salvar saldo:", e);
          }
        },

        prepararEdicao(s) {
          this.editandoId = s.id;
          this.contaSelecionada = s.conta;
          this.valorInput = s.valor;
        },

        cancelarEdicao() {
          this.editandoId = null;
          this.contaSelecionada = '';
          this.valorInput = '';
        },

        async excluirSaldo(id) {
          try {
            await db.collection("saldos").doc(id).delete();
          } catch(e) {
            console.error("Erro ao excluir saldo:", e);
          }
        },

        // Mantém o resumo do Módulo 02 (Dashboard) sempre sincronizado com a soma real
        async atualizarDashboardCentral() {
          const total = this.calcularTotal();
          try {
            await db.collection("dashboard_metricas").doc("resumo").set({ saldoTotal: total }, { merge: true });
          } catch(e) {
            console.warn("Aviso ao atualizar métrica central:", e);
          }
        },

        calcularTotal() {
          return this.saldos.reduce((acc, curr) => acc + (parseFloat(curr.valor) || 0), 0);
        },

        async carregarDados() {
          this.carregando = true;
          setTimeout(() => { this.carregando = false; }, 300);
        },

        formatarMoeda(val) {
          return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
        }
      }));
    });
  </script>
</body>
</html>
